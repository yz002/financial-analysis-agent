name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements-lock.txt

      - name: Seed EDGAR cache from committed fixtures
        run: |
          mkdir -p data/cache
          cp tests/fixtures/edgar_cache/*.json data/cache/

      - name: Run tests
        env:
          # Never sent over the network: the fixture cache above covers every
          # EDGAR request the suite makes, so EdgarClient never gets past its
          # cache-hit path. Only set because EdgarClient.__init__ requires the
          # env var to be present at all, cache hits or not.
          SEC_USER_AGENT: "CI test runner ci@example.com"
        run: pytest

  # The Chrome extension's type check and unit tests (Phase D session 7). No secrets and no
  # network services: vitest mocks the browser and the backend. The backend suite isn't run
  # here; it needs a database (backend/DEPLOYMENT.md, "Backlog: CI coverage").
  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          # Node 24: the local development version (v24.14.0), and within every tool's engines
          # range (vitest ^22.12 || ^24, wxt >=22, vite >=22.12).
          node-version: "24"
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run compile

      - name: Run tests
        run: npm test
